aid: bliq
name: Bliq
description: Bliq is a Berlin-based premium driverless-car subscription service rolling out across
  Europe. Instead of owning a car or paying per ride, members subscribe monthly to a private autonomous
  vehicle that Bliq charges, cleans, insures, maintains, and parks on their behalf. Cars are booked for
  time windows (hours or days) rather than single trips, every journey is remotely supervised by licensed
  local operators, and there is no surge pricing. Backed by Speedinvest, Bliq positions itself as
  "ownership without ownership." The company currently operates a consumer marketing site with
  early-access and waitlist flows and does not publish a public developer API, documentation, or SDKs.
